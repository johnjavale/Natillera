spring:
  application:
    name: natillera-backend
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/natillera}
    username: ${DATABASE_USER:natillera}
    password: ${DATABASE_PASSWORD:natillera}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 60000
      connection-timeout: 10000
      pool-name: natillera-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: America/Bogota
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/Bogota
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always
  main:
    banner-mode: off

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    threads:
      max: 20
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  # Secreto HS256 ≥ 256 bits. En producción SIEMPRE por variable de entorno.
  jwt:
    secret: ${JWT_SECRET}
    access-minutos: 15
    refresh-dias: 7
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  bcrypt:
    cost: 12
  login:
    max-intentos: 5
    ventana-minutos: 15
  fecha-simulada: ${FECHA_SIMULADA:}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
