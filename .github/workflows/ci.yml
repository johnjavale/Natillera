name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unitarias + integración (Testcontainers usa el Docker del runner)
      - name: mvn verify
        run: chmod +x mvnw && ./mvnw -B verify
      - name: OWASP Dependency-Check (falla con CVSS >= 9)
        run: ./mvnw -B org.owasp:dependency-check-maven:12.1.0:check -DfailBuildOnCVSS=9 -DnvdApiKey=${{ secrets.NVD_API_KEY }}
        continue-on-error: ${{ secrets.NVD_API_KEY == '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-backend
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=critical --omit=dev
      - run: npm run build
        env:
          SESSION_SECRET: secreto-de-build-ci-0123456789abcdef0123456789

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Levantar stack
        run: docker compose up -d --build --wait
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          E2E_BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
