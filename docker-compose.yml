# Entorno local completo: MySQL 8 + backend (perfil dev con seed) + frontend.
#   docker compose up --build
#   http://localhost:3000  (admin@natillera.local / Natillera2027*)
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: natillera
      MYSQL_USER: natillera
      MYSQL_PASSWORD: natillera
      MYSQL_ROOT_PASSWORD: root-solo-desarrollo
      TZ: America/Bogota
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -unatillera -pnatillera --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:mysql://mysql:3306/natillera
      DATABASE_USER: natillera
      DATABASE_PASSWORD: natillera
      JWT_SECRET: secreto-solo-para-desarrollo-local-0123456789abcdef
      CORS_ALLOWED_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      FECHA_SIMULADA: "2027-03-20"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 400m

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
      SESSION_SECRET: secreto-de-sesion-solo-desarrollo-0123456789abcdef
      COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysqldata:
